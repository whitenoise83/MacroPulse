[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macropulse"
version = "1.13.0"
description = "Proprietary vintage-aware macroeconomic nowcasting, forecasting and slack-estimation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Cenk Ufuk Yildiran"}
]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "duckdb>=1.3,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<25",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14.6,<0.16",
    "streamlit>=1.46,<2",
    "matplotlib>=3.9,<4",
    "scipy>=1.13,<2",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
