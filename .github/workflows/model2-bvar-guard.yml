name: Model 2 Bayesian VAR Guard

on:
  push:
    branches:
      - model2-bvar-development
    tags:
      - "model2-bvar-v*"
  pull_request:
    branches:
      - model2-bvar-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model2-bvar-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Model 2 research contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install "pytest>=8,<9"

      - name: Verify immutable prerequisite releases
        run: |
          python scripts/verify_phase2_release.py --require-tag
          python scripts/verify_model1d_v038_release.py --require-tags
          python scripts/verify_phase3_evaluation.py
          python scripts/verify_phase3_release.py --require-tag

      - name: Verify Model 2 workstream lineage on branch
        if: github.ref_type != 'tag'
        run: |
          python scripts/verify_model2b_data_vintage_scaffold.py
          python scripts/verify_model2b2_origin_grid.py
          python scripts/verify_model2c_baseline_bvar.py
          python scripts/verify_model2d_probabilistic.py
          python scripts/verify_model2e_irf_fevd.py
          python scripts/verify_model2f_scenarios.py
          python scripts/verify_model2g_evaluation.py
          python scripts/verify_model2h_production.py

      - name: Run focused Model 2 workstream tests on branch
        if: github.ref_type != 'tag'
        run: |
          python -m pytest -q --disable-warnings tests/test_model2b_data_vintage.py
          python -m pytest -q --disable-warnings tests/test_model2b2_origin_grid.py
          python -m pytest -q --disable-warnings tests/test_model2c_baseline_bvar.py
          python -m pytest -q --disable-warnings tests/test_model2d_probabilistic.py
          python -m pytest -q --disable-warnings tests/test_model2e_irf_fevd.py
          python -m pytest -q --disable-warnings tests/test_model2f_scenarios.py
          python -m pytest -q --disable-warnings tests/test_model2g_evaluation.py
          python -m pytest -q --disable-warnings tests/test_model2h_production.py

      - name: Verify Model 2 release record when present
        shell: bash
        run: |
          if [ -f MODEL2_RELEASE.json ]; then
            python scripts/verify_model2_release.py
          else
            echo "Model 2 release record not present on source-hardening commit."
          fi

      - name: Run focused Model 2 release tests when present
        shell: bash
        run: |
          if [ -f tests/test_model2_release_metadata.py ]; then
            python -m pytest -q --disable-warnings tests/test_model2_release_metadata.py
          else
            echo "Model 2 release metadata tests not present."
          fi

      - name: Run complete repository test suite
        run: python -m pytest -q --disable-warnings

      - name: Re-verify Model 2 boundaries
        shell: bash
        run: |
          python scripts/verify_phase2_release.py --require-tag
          python scripts/verify_model1d_v038_release.py --require-tags
          python scripts/verify_phase3_evaluation.py
          python scripts/verify_phase3_release.py --require-tag
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            python scripts/verify_model2b_data_vintage_scaffold.py
            python scripts/verify_model2b2_origin_grid.py
            python scripts/verify_model2c_baseline_bvar.py
            python scripts/verify_model2d_probabilistic.py
            python scripts/verify_model2e_irf_fevd.py
            python scripts/verify_model2f_scenarios.py
            python scripts/verify_model2g_evaluation.py
            python scripts/verify_model2h_production.py
          fi
          if [ -f MODEL2_RELEASE.json ]; then
            python scripts/verify_model2_release.py
          fi

      - name: Verify immutable Model 2 release tag
        if: github.ref_type == 'tag'
        run: python scripts/verify_model2_release.py --require-tag

      - name: Require clean tracked source tree after tests
        shell: bash
        run: |
          if ! git diff --quiet -- . \
            ':(exclude)reports/**' \
            ':(exclude)data/**' \
            ':(exclude)src/macropulse.egg-info/**'; then
            echo "Tracked governed/source files changed during tests."
            git --no-pager diff --stat -- . \
              ':(exclude)reports/**' \
              ':(exclude)data/**' \
              ':(exclude)src/macropulse.egg-info/**'
            exit 1
          fi

      - name: Reject tracked runtime data artifacts
        shell: bash
        run: |
          if git ls-files | grep -E \
            '(^data/backups/|\.duckdb$|\.wal$|^reports/decision_intelligence_snapshots/)'; then
            echo "Tracked runtime artifact detected."
            exit 1
          fi
