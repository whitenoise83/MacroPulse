name: Phase II Platform Guard

on:
  push:
    branches:
      - phase2-platform-development
  pull_request:
    branches:
      - phase2-platform-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-platform-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Phase II platform contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install "pytest>=8,<9"

      - name: Verify frozen Model 1D release boundary
        run: python scripts/verify_model1d_v038_release.py --require-tags

      - name: Verify Phase II platform boundary
        run: python scripts/verify_phase2_platform.py --require-model1d-tags

      - name: Run Phase II platform contract tests
        run: |
          python -m pytest -q --disable-warnings \
            tests/test_phase2_bootstrap_contract.py \
            tests/test_phase2_platform_status.py \
            tests/test_phase2_platform_status_service.py \
            tests/test_phase2_platform_status_runner.py \
            tests/test_phase2_platform_orchestration.py \
            tests/test_phase2_platform_orchestration_execution.py \
            tests/test_phase2_platform_operations_runner.py \
            tests/test_phase2_platform_snapshot.py \
            tests/test_phase2_platform_snapshot_runner.py \
            tests/test_phase2_platform_dashboard.py \
            tests/test_phase2_platform_dashboard_runner.py \
            tests/test_phase2_platform_release_guard.py \
            tests/test_phase2_platform_report_schema.py \
            tests/test_phase2_platform_failure_modes.py

      - name: Run complete repository test suite
        run: python -m pytest -q --disable-warnings

      - name: Re-verify Phase II and Model 1D boundaries
        run: |
          python scripts/verify_phase2_platform.py --require-model1d-tags
          python scripts/verify_model1d_v038_release.py --require-tags

      - name: Require clean tracked working tree after tests
        shell: bash
        run: |
          if ! git diff --quiet -- . ':(exclude)reports/**' ':(exclude)data/**'; then
            echo "Tracked source files changed during tests."
            git --no-pager diff --stat
            exit 1
          fi
