      - [2.0, 0.0]
      - [3.0, 1.0]
      - [4.5, 2.0]
    CPILFESL:
      - [0.8, -2.0]
      - [1.8, -1.0]
      - [2.3, 0.0]
      - [3.3, 1.0]
      - [4.8, 2.0]
    CPIAUCSL:
      - [0.8, -2.0]
