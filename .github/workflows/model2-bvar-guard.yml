name: Model 2 Bayesian VAR Guard

on:
  push:
    branches:
      - model2-bvar-development
  pull_request:
    branches:
      - model2-bvar-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model2-bvar-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Model 2 research contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install "pytest>=8,<9"
      - name: Verify immutable Phase II release
        run: python scripts/verify_phase2_release.py --require-tag
      - name: Verify frozen Model 1D release
        run: python scripts/verify_model1d_v038_release.py --require-tags
      - name: Verify immutable Phase III lineage
        run: python scripts/verify_phase3_evaluation.py
      - name: Verify immutable Phase III release
        run: python scripts/verify_phase3_release.py --require-tag
      - name: Verify frozen Model 2B.1 data and vintage contract
        run: python scripts/verify_model2b_data_vintage_scaffold.py
      - name: Run focused Model 2B.1 tests
        run: python -m pytest -q --disable-warnings tests/test_model2b_data_vintage.py
      - name: Verify frozen Model 2B.2 origin-grid contract
        run: python scripts/verify_model2b2_origin_grid.py
      - name: Run focused Model 2B.2 tests
        run: python -m pytest -q --disable-warnings tests/test_model2b2_origin_grid.py
      - name: Verify frozen Model 2C baseline BVAR contract
        run: python scripts/verify_model2c_baseline_bvar.py
      - name: Run focused Model 2C tests
        run: python -m pytest -q --disable-warnings tests/test_model2c_baseline_bvar.py
      - name: Verify Model 2D probabilistic forecast contract
        run: python scripts/verify_model2d_probabilistic.py
      - name: Run focused Model 2D tests
        run: python -m pytest -q --disable-warnings tests/test_model2d_probabilistic.py
      - name: Run complete repository test suite
        run: python -m pytest -q --disable-warnings
      - name: Re-verify frozen and Model 2 boundaries
        run: |
          python scripts/verify_phase2_release.py --require-tag
          python scripts/verify_model1d_v038_release.py --require-tags
          python scripts/verify_phase3_evaluation.py
          python scripts/verify_phase3_release.py --require-tag
          python scripts/verify_model2b_data_vintage_scaffold.py
          python scripts/verify_model2b2_origin_grid.py
          python scripts/verify_model2c_baseline_bvar.py
          python scripts/verify_model2d_probabilistic.py
      - name: Require clean tracked source tree after tests
        shell: bash
        run: |
          if ! git diff --quiet -- .             ':(exclude)reports/**'             ':(exclude)data/**'             ':(exclude)src/macropulse.egg-info/**'; then
            echo "Tracked governed/source files changed during tests."
            git --no-pager diff --stat -- .               ':(exclude)reports/**'               ':(exclude)data/**'               ':(exclude)src/macropulse.egg-info/**'
            exit 1
          fi
      - name: Reject tracked runtime data artifacts
        shell: bash
        run: |
          if git ls-files | grep -E             '(^data/backups/|\.duckdb$|\.wal$|^reports/decision_intelligence_snapshots/)'; then
            echo "Tracked runtime artifact detected."
            exit 1
          fi
