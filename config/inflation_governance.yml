model:
  model_id: US_INFLATION_NOWCAST_1B
  display_name: MacroPulse Model 1B - US Inflation Nowcast
  version: 1.0.0
  lifecycle_status: production
  owner: MacroPulse
  production_status: production
  targets:
  - CPIAUCSL
  - CPILFESL
  - PCEPI
  - PCEPILFE
  limitations:
  - Release-staged ALFRED validation and strictly prior point-policy evaluation are
    implemented.
  - The approved stable target-stage map controls production headline forecasts.
  - The adaptive selector remains a separately stored shadow challenger and cannot
    control the headline without a new approval cycle.
  - exp_weighted_q80 is the approved prior-only 80% interval method.
  - Live information sets, provenance hashes, governance signatures, and news decompositions
    are stored in DuckDB.
  - Forecasts are monthly log changes annualised by multiplying by 1,200 and can be
    volatile in that presentation.
  - Production performance must be monitored and material model or data-definition
    changes require revalidation.
  validation_source_version: 0.6.0
  promoted_from_package_version: 0.6.0.post1
