targets:
  CPIAUCSL:
    name: Headline CPI
    frequency: M
    transform: annualised_mom_log
    source: FRED
    start_date: '1985-01-01'
  CPILFESL:
    name: Core CPI
    frequency: M
    transform: annualised_mom_log
    source: FRED
    start_date: '1985-01-01'
  PCEPI:
    name: Headline PCE Price Index
    frequency: M
    transform: annualised_mom_log
    source: FRED
    start_date: '1985-01-01'
  PCEPILFE:
    name: Core PCE Price Index
    frequency: M
    transform: annualised_mom_log
    source: FRED
    start_date: '1985-01-01'
features:
  PPIFIS:
    name: Producer Price Index - Final Demand
    frequency: M
    transform: mom_log_pct
    source: FRED
    start_date: '2009-11-01'
  CES0500000003:
    name: Average Hourly Earnings - Total Private
    frequency: M
    transform: mom_log_pct
    source: FRED
    start_date: '2006-03-01'
  CUSR0000SEHA:
    name: CPI Rent of Primary Residence
    frequency: M
    transform: mom_log_pct
    source: FRED
    start_date: '1985-01-01'
  CUSR0000SEHC:
    name: CPI Owners Equivalent Rent
    frequency: M
    transform: mom_log_pct
    source: FRED
    start_date: '1985-01-01'
  UNRATE:
    name: Unemployment Rate
    frequency: M
    transform: diff
    source: FRED
    start_date: '1985-01-01'
  FEDFUNDS:
    name: Effective Federal Funds Rate
    frequency: M
    transform: diff
    source: FRED
    start_date: '1985-01-01'
  T5YIE:
    name: Five-Year Breakeven Inflation Rate
    frequency: D
    monthly_aggregation: mean
    transform: level
    source: FRED
    start_date: '2003-01-01'
  MICH:
    name: University of Michigan Inflation Expectations
    frequency: M
    transform: level
    source: FRED
    start_date: '1985-01-01'
  DCOILWTICO:
    name: West Texas Intermediate Crude Oil Price
    frequency: D
    monthly_aggregation: mean
    transform: mom_log_pct
    source: FRED
    start_date: '1986-01-01'
model:
  target_transform: annualised_mom_log
  target_lags:
  - 1
  - 2
  - 3
  - 6
  - 12
  feature_lags:
  - 1
  - 2
  ridge_alpha: 8.0
  rolling_mean_window: 12
  minimum_training_observations: 120
  interval_coverage: 0.8
  max_feature_carry_months: 2
  preferred_model: Stable target-stage policy candidate
  interval_calibration_method: exp_weighted_q80
  interval_calibration_minimum_errors: 24
  interval_calibration_window: 48
  interval_calibration_half_life: 18
  policy_evaluation_minimum_prior_errors: 24
  policy_evaluation_window: 36
  policy_switch_hurdle: 0.02
  interval_tournament_methods:
  - rolling_q80
  - exp_weighted_q80
  - target_shrunk_q80
  - ewma_gaussian
backtest:
  start_date: '2015-01-01'
  minimum_training_observations: 120
