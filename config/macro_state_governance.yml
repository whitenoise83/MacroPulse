model:
  model_id: US_MACRO_STATE_1D
  display_name: US Unified Macro State Engine
  version: 0.3.1
  lifecycle_status: development
  research_status: Rolling-origin specification stability tournament; not production approved.

required_sources:
  GDP:
    model_id: US_GDP_NOWCAST_1A
    model_version: 1.0.0
    lifecycle_status: production
  inflation:
    model_id: US_INFLATION_NOWCAST_1B
    model_version: 1.0.0
    lifecycle_status: production
  labour:
    model_id: US_LABOUR_NOWCAST_1C
    model_version: 1.0.0
    lifecycle_status: production

inputs:
  inflation_weights:
    PCEPILFE: 0.40
    CPILFESL: 0.30
    PCEPI: 0.20
    CPIAUCSL: 0.10
  labour_weights:
    PAYEMS: 0.40
    UNRATE: 0.35
    CES0500000003: 0.25

score_anchors:
  growth:
    - [0.0, -2.0]
    - [1.0, -1.0]
    - [2.0, 0.0]
    - [3.0, 1.0]
    - [4.0, 2.0]
  inflation:
    PCEPILFE:
      - [0.5, -2.0]
      - [1.5, -1.0]
      - [2.0, 0.0]
      - [3.0, 1.0]
      - [4.5, 2.0]
    PCEPI:
      - [0.5, -2.0]
      - [1.5, -1.0]
      - [2.0, 0.0]
      - [3.0, 1.0]
      - [4.5, 2.0]
    CPILFESL:
      - [0.8, -2.0]
      - [1.8, -1.0]
      - [2.3, 0.0]
      - [3.3, 1.0]
      - [4.8, 2.0]
    CPIAUCSL:
      - [0.8, -2.0]
      - [1.8, -1.0]
      - [2.3, 0.0]
      - [3.3, 1.0]
      - [4.8, 2.0]
  labour:
    PAYEMS:
      - [-50.0, -2.0]
      - [50.0, -1.0]
      - [100.0, 0.0]
      - [175.0, 1.0]
      - [275.0, 2.0]
    UNRATE:
      - [3.5, 2.0]
      - [4.0, 1.0]
      - [4.5, 0.0]
      - [5.5, -1.0]
      - [6.5, -2.0]
    CES0500000003:
      - [2.0, -2.0]
      - [2.8, -1.0]
      - [3.3, 0.0]
      - [4.0, 1.0]
      - [5.0, 2.0]

labels:
  growth:
    - [-1.25, Contraction risk]
    - [-0.40, Below-trend growth]
    - [0.40, Trend-like growth]
    - [1.25, Above-trend growth]
    - [2.01, Strong expansion]
  inflation:
    - [-1.25, Low inflation]
    - [-0.40, Disinflationary pressure]
    - [0.40, Target-consistent pressure]
    - [1.25, Elevated inflation pressure]
    - [2.01, High inflation pressure]
  labour:
    - [-1.25, Material labour slack]
    - [-0.40, Cooling labour market]
    - [0.40, Broadly balanced labour market]
    - [1.25, Tight labour market]
    - [2.01, Very tight labour market]

governance:
  maximum_preferred_cutoff_spread_days: 45
  maximum_allowed_cutoff_spread_days: 120
  minimum_dimension_confidence: 30
  state_score_bounds: [-2.0, 2.0]
  require_production_source_registry: true
  risk_thresholds:
    gdp_lower_80: 0.0
    core_pce_upper_80: 4.0
    payroll_lower_80: 0.0
    unemployment_upper_80: 5.0

history:

  source_mode: production_vintage_backtests
  state_anchor: month_end
  target_alignment: exact_target_period
  require_approved_validation_lineage: true
  require_no_target_leakage: true
  require_max_observation_date_not_after_forecast_date: true
  interval_policy: approved_calibration_preferred_with_vintage_fallback
  gdp_month_stage_map:
    first_month: early_quarter
    second_month: after_month_1
    third_month: quarter_end
  inflation_stage: month_end
  labour_stage: month_end
  default_start_date: 2015-01-01
  frequency: month_end
  minimum_complete_months: 24
  maximum_source_age_days:
    GDP: 120
    inflation: 62
    labour: 62
  uncertainty_samples: 729
  transition_minimum_count: 3
  uncertainty_candidate:
    method: deterministic_gaussian_copula
    draws: 4096
    seed: 12022
    marginal_coverage: 0.80
    probability_floor: 0.01
    correlation:
      - [1.00, 0.20, 0.55]
      - [0.20, 1.00, 0.25]
      - [0.55, 0.25, 1.00]
  use_latest_successful_run_on_or_before_state_date: true
  allow_cross_version_history: true
  accepted_lifecycle_statuses:
    - production
    - candidate
    - development

tournament:
  status: research_tournament
  source_mode: latest_production_vintage_reconstruction
  training_months: 36
  validation_months: 18
  minimum_holdout_months: 12
  top_core_candidates: 12
  score_deadzone: 0.25
  random_seed: 13030
  uncertainty_draws: 1024
  core_metric_weights:
    dimension_rmse: 0.28
    exact_regime_accuracy: 0.22
    family_accuracy: 0.14
    sign_accuracy: 0.10
    churn_gap: 0.08
    distribution_jsd: 0.08
    regime_collapse_penalty: 0.10
  uncertainty_metric_weights:
    brier_score: 0.40
    log_loss: 0.30
    coverage_gap: 0.15
    mean_effective_regimes: 0.10
    top1_accuracy: 0.05
  final_score_weights:
    core: 0.70
    uncertainty: 0.30
  normalization_candidates:
    policy_anchors:
      method: policy_anchors
    target_centered:
      method: target_centered
      centers:
        GDPC1: 2.0
        PCEPILFE: 2.0
        CPILFESL: 2.3
        PCEPI: 2.0
        CPIAUCSL: 2.3
        PAYEMS: 100.0
        UNRATE: 4.5
        CES0500000003: 3.3
      scales:
        GDPC1: 1.0
        PCEPILFE: 1.0
        CPILFESL: 1.0
        PCEPI: 1.0
        CPIAUCSL: 1.0
        PAYEMS: 75.0
        UNRATE: 1.0
        CES0500000003: 0.7
      orientation:
        GDPC1: 1.0
        PCEPILFE: 1.0
        CPILFESL: 1.0
        PCEPI: 1.0
        CPIAUCSL: 1.0
        PAYEMS: 1.0
        UNRATE: -1.0
        CES0500000003: 1.0
    expanding_robust_z:
      method: expanding_robust_z
      minimum_history: 18
      clip: 2.0
      fallback: target_centered
  inflation_weight_candidates:
    policy:
      PCEPILFE: 0.40
      CPILFESL: 0.30
      PCEPI: 0.20
      CPIAUCSL: 0.10
    equal:
      PCEPILFE: 0.25
      CPILFESL: 0.25
      PCEPI: 0.25
      CPIAUCSL: 0.25
    core_heavy:
      PCEPILFE: 0.45
      CPILFESL: 0.35
      PCEPI: 0.10
      CPIAUCSL: 0.10
  labour_weight_candidates:
    policy:
      PAYEMS: 0.40
      UNRATE: 0.35
      CES0500000003: 0.25
    equal:
      PAYEMS: 0.3333333333
      UNRATE: 0.3333333333
      CES0500000003: 0.3333333334
    hard_data:
      PAYEMS: 0.50
      UNRATE: 0.40
      CES0500000003: 0.10
  threshold_candidates:
    baseline:
      hard_growth_max: -0.75
      hard_labour_max: -0.75
      stag_growth_max: -0.75
      stag_inflation_min: 0.75
      overheat_growth_min: 0.75
      overheat_inflation_min: 0.75
      overheat_labour_min: 0.50
      disinflation_growth_min: 0.25
      disinflation_inflation_max: -0.25
      disinflation_labour_min: -0.50
      balanced_growth_min: -0.25
      balanced_growth_max: 0.75
      balanced_inflation_min: -0.40
      balanced_inflation_max: 0.40
      balanced_labour_min: -0.50
      balanced_labour_max: 0.75
      reflation_growth_min: 0.25
      reflation_inflation_min: 0.25
      slowdown_growth_max: -0.25
      slowdown_inflation_max: 0.25
    conservative:
      hard_growth_max: -1.00
      hard_labour_max: -1.00
      stag_growth_max: -1.00
      stag_inflation_min: 1.00
      overheat_growth_min: 1.00
      overheat_inflation_min: 1.00
      overheat_labour_min: 0.75
      disinflation_growth_min: 0.50
      disinflation_inflation_max: -0.50
      disinflation_labour_min: -0.50
      balanced_growth_min: -0.40
      balanced_growth_max: 0.60
      balanced_inflation_min: -0.30
      balanced_inflation_max: 0.30
      balanced_labour_min: -0.40
      balanced_labour_max: 0.60
      reflation_growth_min: 0.50
      reflation_inflation_min: 0.50
      slowdown_growth_max: -0.50
      slowdown_inflation_max: 0.25
    sensitive:
      hard_growth_max: -0.50
      hard_labour_max: -0.50
      stag_growth_max: -0.50
      stag_inflation_min: 0.50
      overheat_growth_min: 0.50
      overheat_inflation_min: 0.50
      overheat_labour_min: 0.25
      disinflation_growth_min: 0.10
      disinflation_inflation_max: -0.10
      disinflation_labour_min: -0.75
      balanced_growth_min: -0.40
      balanced_growth_max: 0.90
      balanced_inflation_min: -0.60
      balanced_inflation_max: 0.60
      balanced_labour_min: -0.75
      balanced_labour_max: 1.00
      reflation_growth_min: 0.10
      reflation_inflation_min: 0.10
      slowdown_growth_max: -0.10
      slowdown_inflation_max: 0.40
  uncertainty_candidates:
    independent_normal:
      method: independent_normal
    fixed_gaussian_copula:
      method: fixed_gaussian_copula
      correlation:
        - [1.00, 0.20, 0.55]
        - [0.20, 1.00, 0.25]
        - [0.55, 0.25, 1.00]
    expanding_residual_copula:
      method: expanding_residual_copula
      minimum_history: 24
      shrinkage: 0.50
      fallback: fixed_gaussian_copula


stability_tournament:
  status: research_stability_tournament
  source_mode: latest_production_vintage_reconstruction
  source_tournament_status: research_tournament_consumed_audit
  minimum_training_months: 30
  evaluation_months: 6
  step_months: 3
  audit_months: 19
  minimum_folds: 7
  top_core_candidates: 12
  leading_third_fraction: 0.3333333333
  catastrophic_rank_fraction: 0.8333333333
  minimum_leading_third_rate: 0.60
  minimum_baseline_dominance_rate: 0.60
  minimum_uncertainty_method_win_rate: 0.40
  minimum_proper_score_dominance_rate: 0.60
  minimum_bootstrap_margin_lower: 0.00
  maximum_regime_collapse_fold_rate: 0.40
  bootstrap_repetitions: 1000
  bootstrap_block_months: 3
  bootstrap_confidence: 0.90
  random_seed: 13031
  score_deadzone: 0.25
  core_stability_weights:
    mean_fold_score: 0.30
    median_fold_score: 0.20
    rank_stability: 0.15
    leading_third_rate: 0.15
    baseline_dominance_rate: 0.15
    average_regret: 0.05
  final_stability_weights:
    mean_fold_score: 0.25
    median_fold_score: 0.20
    rank_stability: 0.15
    leading_third_rate: 0.15
    baseline_dominance_rate: 0.15
    uncertainty_method_win_rate: 0.05
    average_regret: 0.05
  subperiods:
    pandemic_reopening:
      start: 2020-02-29
      end: 2021-12-31
    inflation_acceleration:
      start: 2022-01-31
      end: 2023-06-30
    disinflation_late_cycle:
      start: 2023-07-31
      end: 2024-12-31
    recent_reflation_risk:
      start: 2025-01-31
      end: 2026-03-31
