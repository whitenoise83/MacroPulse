name: Phase III Evaluation Guard

on:
  push:
    branches:
      - phase3-evaluation-development
    tags:
      - "phase3-evaluation-v*"
  pull_request:
    branches:
      - phase3-evaluation-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-evaluation-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Phase III evaluation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install "pytest>=8,<9"

      - name: Verify immutable Phase II release
        run: python scripts/verify_phase2_release.py --require-tag

      - name: Verify frozen Model 1D v0.3.8 release
        run: python scripts/verify_model1d_v038_release.py --require-tags

      - name: Verify Phase III hardening boundary
        if: github.ref_type != 'tag'
        run: python scripts/verify_phase3_evaluation.py

      - name: Verify Phase III release record when present
        shell: bash
        run: |
          if [ -f PHASE3_RELEASE.json ]; then
            python scripts/verify_phase3_release.py
          else
            echo "Phase III release record not present on this source-gate commit."
          fi

      - name: Run focused Phase III tests
        run: python -m pytest -q --disable-warnings tests/test_phase3*.py

      - name: Run complete repository test suite
        run: python -m pytest -q --disable-warnings

      - name: Re-verify frozen and Phase III boundaries
        shell: bash
        run: |
          python scripts/verify_phase2_release.py --require-tag
          python scripts/verify_model1d_v038_release.py --require-tags
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            python scripts/verify_phase3_evaluation.py
          fi
          if [ -f PHASE3_RELEASE.json ]; then
            python scripts/verify_phase3_release.py
          fi

      - name: Verify immutable Phase III release tag
        if: github.ref_type == 'tag'
        run: python scripts/verify_phase3_release.py --require-tag

      - name: Require clean tracked source tree after tests
        shell: bash
        run: |
          if ! git diff --quiet -- . \
            ':(exclude)reports/**' \
            ':(exclude)data/**' \
            ':(exclude)src/macropulse.egg-info/**'; then
            echo "Tracked governed/source files changed during tests."
            git --no-pager diff --stat -- . \
              ':(exclude)reports/**' \
              ':(exclude)data/**' \
              ':(exclude)src/macropulse.egg-info/**'
            exit 1
          fi

      - name: Reject tracked Phase III runtime artifacts
        shell: bash
        run: |
          if git ls-files | grep -E \
            '(^data/backups/|\.duckdb$|\.wal$|^reports/decision_intelligence_snapshots/)'; then
            echo "Tracked Phase III runtime artifact detected."
            exit 1
          fi
