[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macropulse"
version = "1.13.0"
description = "Vintage-aware macroeconomic nowcasting platform"
requires-python = ">=3.11"
dependencies = [
    "tabulate>=0.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
