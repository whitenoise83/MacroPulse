policy_candidate:
  status: production_approved
  selection_basis: vintage stage metrics, common-sample verification, stability, bias,
    and tail-risk judgement
  stable_map:
    CPIAUCSL:
      month_open: Inflation Ridge-AR Ensemble
      mid_month: Inflation Ridge-AR Ensemble
      month_end: Inflation Ridge-AR Ensemble
      pre_release: Inflation Ridge-AR Ensemble
    CPILFESL:
      month_open: Inflation 12-Month Mean
      mid_month: Inflation Ridge-AR Ensemble
      month_end: Inflation Ridge-AR Ensemble
      pre_release: Inflation Ridge-AR Ensemble
    PCEPI:
      month_open: Inflation Bridge Ridge
      mid_month: Inflation Bridge Ridge
      month_end: Inflation Bridge Ridge
      pre_release: Inflation Bridge Ridge
    PCEPILFE:
      month_open: Inflation Bridge Ridge
      mid_month: Inflation Ridge-AR Ensemble
      month_end: Inflation Ridge-AR Ensemble
      pre_release: Inflation Ridge-AR Ensemble
  shadow_selector:
    minimum_prior_errors: 24
    rolling_window: 36
    switch_hurdle: 0.02
    mae_guard: 1.05
    tail_guard: 1.1
    max_error_guard: 1.15
    role: shadow_challenger_only
  production_role: headline_production_policy
interval_candidate:
  status: production_approved
  method: exp_weighted_q80
  nominal_coverage: 0.8
  minimum_prior_errors: 24
  rolling_window: 48
  half_life_months: 18
  selection_basis:
  - lowest mean interval score in the predeclared tournament
  - narrowest average half-width among tournament candidates
  - aggregate empirical coverage of 0.847
  - target-stage empirical coverage between 0.816 and 0.904
  production_role: headline_uncertainty_method
governed_live:
  candidate_validation_type: candidate_policy
  require_passing_candidate_validation: true
  persist_information_set: true
  persist_all_components: true
  governance_signature: sha256_canonical_payload
  news_decomposition:
    enabled: true
    attribution_order:
    - revisions
    - removed_observations
    - new_observations
    - stable_policy_change
    arithmetic_tolerance: 1.0e-08
  operational_validation:
    minimum_targets: 4
    minimum_prior_errors: 24
    maximum_news_residual: 1.0e-08
  production_status: approved
candidate_validation:
  status: passed
  passed_checks: 28
  failed_checks: 0
  warnings: 0
  point_policy: stable_map
  adaptive_policy: shadow_only
  interval_method: exp_weighted_q80
  required_next_steps:
  - monitor governed live forecast performance and interval calibration
  - retain adaptive selector as shadow-only
  - trigger revalidation when declared production thresholds are breached
production:
  status: approved
  version: 1.0.0
  point_policy: stable_map
  shadow_policy: adaptive_shadow_only
  interval_method: exp_weighted_q80
  revalidation_triggers:
  - any target leakage or future-observation audit failure
  - governance signature or provenance hash reproduction failure
  - stable headline policy deviates from the approved target-stage map
  - adaptive shadow is allowed to control a headline forecast
  - news decomposition residual exceeds 1e-8
  - material target, predictor, transformation, release-stage, or data-source definition
    change
  - production RMSE or MAE exceeds the best eligible static model by more than 10
    percent in a target-stage group after at least 24 new evaluated forecasts
  - production p90 absolute error exceeds the best eligible static model by more than
    20 percent in a target-stage group after at least 24 new evaluated forecasts
  - target-stage interval coverage falls outside 60 to 95 percent after at least 24
    new eligible forecasts
  - two consecutive target releases produce absolute errors above the historical 90th
    percentile for the same target-stage policy
  monitoring:
    minimum_new_forecasts_before_relative_performance_retest: 24
    minimum_new_forecasts_before_coverage_retest: 24
    maximum_news_residual: 1.0e-08
    nominal_interval_coverage: 0.8
